<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V | Academy</title>
<style>
:root{--black:#111;--gold:#ff9f1a;--gold2:#fff0d0;--line:#f4bd6b;--green:#0b8f52;--bg:#fffaf0}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#06101f}.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}.side{background:#111;color:white;padding:24px 16px;position:sticky;top:0;height:100vh;overflow:auto;border-right:5px solid var(--gold)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.brand img{width:80px}.brand h1{font-size:28px;margin:0}.brand small{color:#ffd56a}.profile{border:1px solid #8a6a2c;background:#242424;border-radius:18px;padding:16px;margin-bottom:22px}.profile b{font-size:18px}.bar{height:10px;background:#666;border-radius:10px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold);width:0}.nav button,.pin{display:block;width:100%;background:transparent;color:white;border:0;text-align:left;padding:14px 16px;margin:6px 0;border-radius:12px;font-weight:700;font-size:17px;cursor:pointer}.nav button.active,.nav button:hover{background:#4a3214}.pins{border-top:1px solid #444;margin-top:22px;padding-top:16px}.pin{background:#282828;font-size:14px;display:flex;justify-content:space-between}.pin span:last-child{color:#ffd56a}.main{padding:28px 34px;overflow:auto}.hero,.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:28px;margin-bottom:24px;box-shadow:0 18px 55px rgba(255,159,26,.12)}.hero{background:linear-gradient(90deg,var(--gold2),#fff)}.eyebrow{color:#9b5f00;text-transform:uppercase;letter-spacing:2px;font-size:13px;font-weight:900}.hero h2{font-size:36px;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fffdf8}.card h3{margin-top:0}.btn{background:var(--gold);border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer}.btn.secondary{background:white;border:1px solid var(--line)}.layout3{display:grid;grid-template-columns:290px minmax(0,1fr);gap:26px}.courseMenu{background:white;border-right:1px solid #eee;padding:10px;max-height:calc(100vh - 60px);overflow:auto}.lessonBtn{width:100%;text-align:left;border:0;background:#fff;padding:14px;border-radius:14px;margin:6px 0;font-weight:800;cursor:pointer}.lessonBtn.active{background:#fff0d0;border:1px solid var(--gold)}.lessonBtn.done{background:#e7f7ed;color:#006b3c}.prompt{white-space:pre-wrap;background:#111;color:white;border-radius:16px;padding:18px;line-height:1.45}.workflowPrompt{display:none;margin-top:14px}.muted{color:#526071}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.toast{position:fixed;right:24px;bottom:24px;background:#111;color:#fff;padding:18px;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.25);max-width:420px;z-index:20}.hide{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.layout3{grid-template-columns:1fr}.main{padding:16px}.kpis{grid-template-columns:1fr}}
</style></head><body><div id="app"></div><div id="toast" class="toast hide"></div><script>
const CONFIG = {"version": "3.2.1", "syncUrl": "https://script.google.com/macros/s/AKfycbxdqtdKgIBi9hD0N63FLNOFPLPxgLUA05lGGz-ft1I39ihZQfnqktsZ5s9i6Ib3CP9Zvw/exec"};
const PATHS = {"foundations": {"title": "AI Foundations", "role": "Everyone", "lessons": [["start_day", "Start Your Day"], ["communicate", "Communicate Professionally"], ["documents", "Understand Documents"], ["answers", "Find Better Answers"], ["vanilla_knowledge", "Vanilla Knowledge"], ["work_smarter", "Work Smarter"]]}, "bdm": {"title": "Business Development", "role": "BDM / Management", "lessons": [["owner_prep", "Owner Preparation"], ["suburb_research", "Suburb Research"], ["objections", "Objection Handling"], ["followup", "Owner Follow-up"], ["marketing", "Investor Education Content"]]}, "pm": {"title": "Property Manager", "role": "Property Managers", "lessons": [["morning_triage", "Morning Triage"], ["maintenance", "Maintenance Workflow"], ["owner_updates", "Owner Updates"], ["lease_renewals", "Lease Renewals"], ["qcat", "QCAT Preparation"], ["end_day", "End-of-Day Wrap-up"]]}, "assistant": {"title": "PM Assistant", "role": "Assistants", "lessons": [["inbox", "Inbox Support"], ["apps", "Application Support"], ["keys", "Keys and Access"], ["documents", "Document Prep"], ["scheduling", "Scheduling and Follow-up"]]}, "admin": {"title": "Administration", "role": "Admin / Reception", "lessons": [["reception", "Reception Triage"], ["phones", "Phone Message Cleaner"], ["sops", "SOP Builder"], ["reports", "Reporting Support"], ["staff", "Staff Communication"]]}};
const WORKFLOWS = [{"title": "Daily Startup", "description": "Trigger: start of day. Turn Gmail, Calendar and loose follow-ups into a practical action plan.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Daily Startup\n\nTrigger moment:\nIt is the start of the workday and I need to know what deserves my attention first.\n\nUse this when:\nmy Gmail and Calendar are available, I have appointments today, or I feel scattered before the day starts.\n\nDo not use this when:\nI need urgent human judgement, legal advice, or the task requires immediate emergency action.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nMy role, today’s appointments, any known priorities, and any Gmail/Calendar summaries ChatGPT can access.\n\nOutput format:\n1. Today’s priorities\n2. Appointment preparation\n3. Follow-ups due\n4. Emails needing attention\n5. Suggested work blocks\n6. Risks or conflicts\n7. End-of-day checklist\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Owner Follow-up", "description": "Trigger: after an owner call, appraisal, maintenance update or difficult conversation.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Owner Follow-up\n\nTrigger moment:\nI have spoken with, met, or emailed an owner and need to send a clear follow-up with next steps.\n\nUse this when:\nthere were decisions, promises, questions, objections, maintenance items or future actions discussed.\n\nDo not use this when:\nthe matter is sensitive, legally complex or I have not checked the facts, dates or amounts.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nOwner name, property, discussion notes, promises made, deadline, preferred tone and any attachments or links to mention.\n\nOutput format:\n1. Suggested subject line\n2. Owner follow-up email\n3. Short SMS option\n4. Internal note for PropertyMe/Gmail\n5. Follow-up task checklist\n6. Items I must verify before sending\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Calendar Planner", "description": "Trigger: before a busy day, appraisal run, inspection run or week with many appointments.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Calendar Planner\n\nTrigger moment:\nMy calendar has multiple appointments and I need a realistic plan for preparation, travel, admin and follow-up.\n\nUse this when:\nI have connected Calendar access or can paste my schedule, and I want help finding gaps or overload.\n\nDo not use this when:\nthe schedule involves private matters that should not be shared, or route/timing needs live navigation accuracy.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nCalendar events, appointment locations, must-do tasks, office commitments and any travel constraints.\n\nOutput format:\n1. Day overview\n2. Prep needed before each appointment\n3. Gaps suitable for admin/follow-up\n4. Possible conflicts or overload\n5. Suggested order or priority\n6. Follow-up block recommendations\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Gmail Follow-up Finder", "description": "Trigger: when promised replies or owner/tenant follow-ups may be slipping through Gmail.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Gmail Follow-up Finder\n\nTrigger moment:\nI need to find conversations where I promised to come back to someone or where a reply is overdue.\n\nUse this when:\nGmail is connected, or I can paste search results/thread summaries.\n\nDo not use this when:\nI expect AI to send, archive or change emails without human review.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nRole, date range, keywords if relevant, and the type of follow-up I am looking for.\n\nOutput format:\n1. Possible overdue follow-ups\n2. Who is waiting\n3. What they are waiting for\n4. Suggested reply or next action\n5. Priority rating\n6. Suggested Gmail search terms\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Meeting Notes Cleaner", "description": "Trigger: after Zoom, phone calls, appraisals, staff meetings or owner conversations.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Meeting Notes Cleaner\n\nTrigger moment:\nI have rough meeting or call notes and need them turned into a clean summary and action list.\n\nUse this when:\nthe notes are messy, informal, voice-transcribed, or contain mixed discussion points and tasks.\n\nDo not use this when:\nthe notes contain sensitive personal information that does not need to be processed, or I have not reviewed the transcript.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nRaw notes/transcript, meeting purpose, attendees, property if relevant, and the audience for the summary.\n\nOutput format:\n1. Clean meeting summary\n2. Decisions made\n3. Action items with owner/person responsible\n4. Follow-up messages needed\n5. Risks or unresolved questions\n6. PropertyMe/Gmail note version\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Maintenance Summary", "description": "Trigger: when maintenance emails, tenant notes, tradie updates and owner messages need one clear update.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Maintenance Summary\n\nTrigger moment:\nA maintenance matter has multiple messages or moving parts and I need a clear summary before contacting the owner, tenant or tradie.\n\nUse this when:\nthere are multiple emails, photos, quotes, tenant concerns, tradie comments, access issues or owner approval questions.\n\nDo not use this when:\nthere is an emergency repair or safety concern requiring immediate escalation rather than AI drafting.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nProperty, tenant issue, tradie notes, photos described, quote details, owner instructions and current status.\n\nOutput format:\n1. Plain-English issue summary\n2. Timeline of what has happened\n3. Current blocker\n4. Recommended next action\n5. Owner update draft\n6. Tenant update draft\n7. Tradie instruction draft\n8. Risk/urgency notes\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Inspection Follow-up Planner", "description": "Trigger: after Inspection Report Agent or inspection review, when follow-up actions need to be organised.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Inspection Follow-up Planner\n\nTrigger moment:\nI already have inspection notes, an inspection report, or Inspection Report Agent output and need to turn it into follow-up actions.\n\nUse this when:\nthe comments are already prepared, but I need maintenance actions, tenant follow-up, owner summary or PM checklist.\n\nDo not use this when:\nI need AI to write the inspection comments themselves — use the Inspection Report Agent for that instead.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nInspection report summary, flagged maintenance items, tenant issues, owner-sensitive items, property address and urgency notes.\n\nOutput format:\n1. Maintenance actions\n2. Tenant follow-up items\n3. Owner update summary\n4. PM tasks to create\n5. Suggested priority\n6. Items needing photo/evidence check\n7. Short email drafts if needed\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "QCAT Timeline", "description": "Trigger: when a dispute, breach, bond or tribunal matter needs a clear chronology.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: QCAT Timeline\n\nTrigger moment:\nI need to organise events, emails, notices, photos and evidence into a clear chronology for a tenancy dispute or tribunal preparation.\n\nUse this when:\nI have dates, documents, emails or notes that need to be put into sequence.\n\nDo not use this when:\nI need legal advice, legal conclusions or a guarantee of tribunal outcome. This should organise facts only.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nProperty, tenant/owner names if appropriate, issue type, key dates, documents, notices, emails and evidence notes.\n\nOutput format:\n1. Chronology table\n2. Evidence list\n3. Missing documents\n4. Risk points to verify\n5. Plain-English case summary\n6. Questions for PM/manager\n7. Draft internal handover note\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Rent Review Helper", "description": "Trigger: before recommending a rent change, lease renewal or owner discussion about market rent.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Rent Review Helper\n\nTrigger moment:\nI need to prepare a practical rent review recommendation for an owner or internal review.\n\nUse this when:\nthere is current rent, proposed rent, comparable evidence, tenant history or lease renewal timing to consider.\n\nDo not use this when:\nI have not checked current legislation, notice periods, lease dates or market evidence. AI must not invent figures.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nProperty, current rent, proposed rent, lease dates, comparable properties, tenant history, owner preference and any CMA notes.\n\nOutput format:\n1. Rent review summary\n2. Supporting reasons\n3. Risks or sensitivity points\n4. Owner recommendation email\n5. Tenant communication draft if appropriate\n6. Internal checklist\n7. Facts to verify before action\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Lease Renewal Prep", "description": "Trigger: when a lease is approaching expiry and the PM needs a structured renewal plan.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Lease Renewal Prep\n\nTrigger moment:\nA lease is coming up for renewal and I need to prepare the owner recommendation and follow-up tasks.\n\nUse this when:\nI need to combine lease dates, rent review, tenant history, maintenance issues and owner communication into one plan.\n\nDo not use this when:\nI have not verified the lease expiry, rent increase rules, owner instructions or required forms.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nProperty, lease expiry, current rent, rent recommendation, tenant history, arrears, maintenance concerns and owner preference.\n\nOutput format:\n1. Renewal readiness summary\n2. Owner recommendation\n3. Tenant communication points\n4. Risk checklist\n5. Required tasks\n6. Suggested timeline\n7. Follow-up email draft\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Difficult Conversation Prep", "description": "Trigger: before calling or replying to a frustrated owner, tenant, applicant or tradie.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Difficult Conversation Prep\n\nTrigger moment:\nI need to respond to a difficult or emotional property management conversation without sounding defensive or robotic.\n\nUse this when:\nsomeone is unhappy, confused, upset, chasing an answer or objecting to a decision.\n\nDo not use this when:\nthe matter is legal, threatening, discriminatory, unsafe or requires manager approval before response.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nWho is involved, what happened, what they want, what Vanilla can/cannot do, desired outcome and tone.\n\nOutput format:\n1. Situation summary\n2. Likely concerns\n3. Calm response strategy\n4. Phone call talking points\n5. Email reply draft\n6. Things not to say\n7. Escalation or verification checklist\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "SOP Builder", "description": "Trigger: when a repeated office task needs to become a clear Vanilla procedure.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: SOP Builder\n\nTrigger moment:\nA repeated process needs to become a clear SOP or checklist that another staff member can follow.\n\nUse this when:\nthe process is currently in someone’s head, messy notes, a video transcript or inconsistent steps.\n\nDo not use this when:\nthe process involves policy decisions that management has not approved.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nProcess name, purpose, who does it, trigger, systems used, steps, exceptions and examples.\n\nOutput format:\n1. SOP title\n2. Purpose\n3. Trigger\n4. Roles responsible\n5. Step-by-step process\n6. Exceptions\n7. Quality checklist\n8. Training notes\n9. Questions needing management decision\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}, {"title": "Prompt Builder", "description": "Trigger: when a normal prompt keeps producing weak, vague or inconsistent answers.", "prompt": "You are assisting a Vanilla Rentals team member.\n\nWorkflow: Prompt Builder\n\nTrigger moment:\nI need to turn a rough request into a stronger prompt before using ChatGPT or V | Assist.\n\nUse this when:\nthe task needs better context, role, audience, tone, output format or constraints.\n\nDo not use this when:\nthe task is too sensitive to outsource, or I do not know the underlying facts yet.\n\nBefore producing the final output:\n1. Ask for any missing details that are essential.\n2. Do not invent facts, dates, names, amounts or legislation.\n3. Keep the wording practical, professional and suitable for property management.\n4. Separate confirmed facts from assumptions or items that need checking.\n\nInformation I will provide:\nRough task, intended audience, desired output, important facts, tone, constraints and examples if available.\n\nOutput format:\n1. Improved prompt\n2. Why the prompt is stronger\n3. Missing context questions\n4. Optional shorter version\n5. Output format suggestion\n6. Review checklist\n\nReview checklist:\n- Is the output clear enough to use at work?\n- Are the next steps obvious?\n- Are any facts, dates, recipients or legal points still needing verification?\n- Is the tone appropriate for Vanilla Rentals?"}];
const FEATURES = [["gmail", "Gmail", "Use Gmail with ChatGPT for inbox triage, follow-up discovery and thread summaries. Use native ChatGPT for Gmail integration, not Custom GPTs."], ["calendar", "Calendar", "Use Calendar to prepare your day, plan appointments and create realistic follow-up blocks."], ["projects", "Projects", "Useful for longer ongoing work. Not essential for every PM task. Best for QCAT prep, campaigns, SOPs and long-running projects."], ["deep", "Deep Research", "Use when a question needs current sources and a proper research pass. Do not use it for quick drafting."], ["vassist", "V | Assist", "Vanilla-specific assistant for internal templates, workflows and wording. Not the default for Gmail or Calendar tasks."], ["safety", "AI Safety", "Privacy, verification, legal/financial caution and human review before sending."]];
const state = JSON.parse(localStorage.getItem('vAcademyState')||'{"profile":{"name":"Ivan","role":"Property Manager"},"page":"dashboard","completed":{},"pins":[]}');
function save(){localStorage.setItem('vAcademyState',JSON.stringify(state));renderSide();}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hide');setTimeout(()=>t.classList.add('hide'),4500)}
function pctPath(pid){const p=PATHS[pid]; if(!p)return 0; const done=p.lessons.filter(l=>state.completed[pid+':'+l[0]]).length; return Math.round(done/p.lessons.length*100)}
function overall(){const ids=Object.keys(PATHS); return Math.round(ids.reduce((a,id)=>a+pctPath(id),0)/ids.length)||0}
function sidebar(){return `<aside class="side"><div class="brand"><img src="assets/vanilla-logo.png"><div><h1>V | Academy</h1><small>Learn work. Use AI.</small></div></div><div class="profile"><b>${state.profile.name||'Set up profile'}</b><div style="color:#ffd56a;margin:8px 0">${state.profile.role||'Required before syncing'}</div><div class="muted" style="color:#ffd56a">Overall progress ${overall()}%</div><div class="bar"><i style="width:${overall()}%"></i></div></div><nav class="nav">${[['dashboard','🏠 Dashboard'],['paths','🎓 Learning Paths'],['features','✨ AI Features'],['toolbox','🧰 Toolbox'],['progress','📈 Progress'],['settings','⚙ Settings']].map(([id,label])=>`<button class="${state.page===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}</nav><div class="pins"><b style="color:#ffd56a">📌 Pinned tools</b><div id="pinList">${state.pins.length?state.pins.map(title=>`<div class="pin"><span>${title}</span><span onclick="unpin('${esc(title)}')">×</span></div>`).join(''):'<p style="color:#ffd56a">No pinned tools yet.</p>'}</div><small style="color:#ffd56a">Version 3.2.1 fixed</small></div></aside>`}
function renderSide(){const old=document.querySelector('.side'); if(old) old.outerHTML=sidebar()}
function go(page){state.page=page; save(); render(); window.scrollTo(0,0)}
function render(){document.getElementById('app').innerHTML=sidebar()+`<main class="main">${page()}</main>`}
function page(){if(state.page==='paths')return pathsPage(); if(state.page==='features')return featuresPage(); if(state.page==='toolbox')return toolboxPage(); if(state.page==='progress')return progressPage(); if(state.page==='settings')return settingsPage(); if(state.page.startsWith('course:'))return coursePage(state.page.split(':')[1]); if(state.page.startsWith('feature:'))return featurePage(state.page.split(':')[1]); return dashboard()}
function dashboard(){let next=Object.keys(PATHS).find(id=>pctPath(id)<100)||'foundations';return `<section class="hero"><div class="eyebrow">Dashboard</div><h2>Your next best step</h2><p>Continue with the most useful workflow-first training. AI Foundations comes first, then role playbooks.</p><button class="btn" onclick="go('course:${next}')">Continue ${PATHS[next].title}</button></section><section class="panel"><h2>Learning snapshot</h2><div class="grid">${Object.entries(PATHS).map(([id,p])=>pathCard(id,p)).join('')}</div></section>`}
function pathCard(id,p){return `<div class="card"><h3>${p.title}</h3><p class="muted">${p.role}</p><div class="bar"><i style="width:${pctPath(id)}%"></i></div><b>${pctPath(id)}% complete</b><br><br><button class="btn secondary" onclick="go('course:${id}')">Open</button></div>`}
function pathsPage(){return `<section class="hero"><div class="eyebrow">Learning Paths</div><h2>Choose your learning path</h2><p>AI Foundations is recommended first. Role paths are recommended, not locked.</p></section><section class="panel"><div class="grid">${Object.entries(PATHS).map(([id,p])=>pathCard(id,p)).join('')}</div></section>`}
function coursePage(pid){const p=PATHS[pid]; const current=state.currentLesson?.[pid]||p.lessons[0][0]; const lesson=p.lessons.find(l=>l[0]===current)||p.lessons[0]; return `<div class="layout3"><div class="courseMenu"><h2>${p.title}</h2><p class="muted">${p.role}</p><div class="bar"><i style="width:${pctPath(pid)}%"></i></div>${p.lessons.map(l=>`<button class="lessonBtn ${l[0]===lesson[0]?'active':''} ${state.completed[pid+':'+l[0]]?'done':''}" onclick="openLesson('${pid}','${l[0]}')">${state.completed[pid+':'+l[0]]?'✓':'•'} ${l[1]}</button>`).join('')}</div><div>${lessonContent(pid,lesson)}</div></div>`}
function openLesson(pid,lid){state.currentLesson=state.currentLesson||{}; state.currentLesson[pid]=lid; save(); render(); document.querySelector('.main').scrollTo?.(0,0)}
function lessonContent(pid,lesson){let samples=WORKFLOWS.slice(0,3); return `<section class="hero"><div class="eyebrow">${PATHS[pid].title}</div><h2>${lesson[1]}</h2><p>This playbook teaches a real trigger moment, practical AI use and review habits. Use it with real work, not theory.</p><div class="kpis"><div class="card"><b>Suggested time</b><br>10–20 min</div><div class="card"><b>Model</b><br>Learn → Try → Review</div><div class="card"><b>Status</b><br>${state.completed[pid+':'+lesson[0]]?'Complete':'In progress'}</div></div></section><section class="panel"><h2>Trigger moment</h2><p>Open this when the task shows up in your normal workday and you need AI to help organise, draft, summarise or prepare the next action.</p><h2>Sample prompts</h2>${samples.map(w=>`<details class="card"><summary><b>${w.title}</b></summary><pre class="prompt">${escapeHtml(w.prompt)}</pre><button class="btn" onclick="copyText(WORKFLOWS.find(x=>x.title==='${esc(w.title)}').prompt)">Copy prompt</button></details>`).join('')}<div class="card"><h2>Complete this mission</h2><p>This is your own learning record, not a test. Complete it when you have genuinely tried the practical task.</p><button class="btn" onclick="toggleComplete('${pid}','${lesson[0]}')">${state.completed[pid+':'+lesson[0]]?'Mark incomplete':'Mark complete'}</button></div></section>`}
function toggleComplete(pid,lid){const k=pid+':'+lid; state.completed[k]=!state.completed[k]; if(!state.completed[k]) delete state.completed[k]; save(); render(); if(pctPath(pid)===100) notify(`Excellent work. You completed ${PATHS[pid].title}. This learning path is now ready to review or apply at work.`)}
function featuresPage(){return `<section class="hero"><div class="eyebrow">AI Features</div><h2>Know the tools, then use them in workflows</h2><p>Feature pages explain what each tool does, when to use it, when not to use it and real Vanilla examples.</p></section><section class="panel"><div class="grid">${FEATURES.map(f=>`<div class="card"><h3>${f[1]}</h3><p>${f[2]}</p><button class="btn secondary" onclick="go('feature:${f[0]}')">Open</button></div>`).join('')}</div></section>`}
function featurePage(fid){const f=FEATURES.find(x=>x[0]===fid)||FEATURES[0];return `<section class="hero"><div class="eyebrow">AI Capability</div><h2>${f[1]}</h2><p>${f[2]}</p></section><section class="panel"><h2>When to use it</h2><p>Use this capability when it clearly saves time, improves structure, finds missing context, or helps prepare work before a human decision.</p><h2>Prompt pack</h2>${WORKFLOWS.slice(0,4).map(w=>`<details class="card"><summary><b>${w.title}</b></summary><pre class="prompt">${escapeHtml(w.prompt)}</pre><button class="btn" onclick="copyText(WORKFLOWS.find(x=>x.title==='${esc(w.title)}').prompt)">Copy prompt</button></details>`).join('')}</section>`}
function toolboxPage(){return `<section class="hero"><div class="eyebrow">Toolbox</div><h2>Reusable Vanilla workflows</h2><p>Every workflow has a trigger moment. Pin the ones you actually use.</p></section><section class="panel"><div class="grid">${WORKFLOWS.map(w=>`<div class="card"><h3>🧰 ${w.title}</h3><p>${w.description}</p><button class="btn secondary" onclick="copyText(WORKFLOWS.find(x=>x.title==='${esc(w.title)}').prompt)">Copy workflow prompt</button> <button class="btn secondary" onclick="pin('${esc(w.title)}')">📌 Pin</button></div>`).join('')}</div></section>`}
function progressPage(){return `<section class="hero"><div class="eyebrow">Progress</div><h2>Your learning record</h2><p>Progress is stored locally and synced when configured.</p></section><section class="panel"><div class="grid">${Object.entries(PATHS).map(([id,p])=>pathCard(id,p)).join('')}</div></section>`}
function settingsPage(){return `<section class="hero"><div class="eyebrow">Settings</div><h2>Profile and backup</h2><p>Keep your name and role current.</p><input id="name" placeholder="Name" value="${state.profile.name||''}"><input id="role" placeholder="Role" value="${state.profile.role||''}"><br><br><button class="btn" onclick="state.profile={name:document.getElementById('name').value,role:document.getElementById('role').value};save();render();notify('Profile saved')">Save profile</button></section>`}
function pin(title){if(!state.pins.includes(title))state.pins.push(title);save();notify('Pinned '+title)}
function unpin(title){state.pins=state.pins.filter(x=>x!==title);save();render()}
function copyText(txt){navigator.clipboard?.writeText(txt);notify('Copied workflow prompt')}
function esc(s){return String(s).replace(/'/g,"\\'")}
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
render();
</script></body></html>
